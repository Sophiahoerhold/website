<ol class="termine">
  {{ range sort hugo.Data.termine "datum" }}
  {{ $d := time .datum }}
  <li>
    <time datetime="{{ $d.Format "2006-01-02" }}"><span class="tag">{{ $d.Format "02" }}</span><span class="monat">{{ index (slice "Jan" "Feb" "Mär" "Apr" "Mai" "Jun" "Jul" "Aug" "Sep" "Okt" "Nov" "Dez") (sub $d.Month 1) }} {{ $d.Year }}</span></time>
    <div><strong>{{ .titel }}</strong><span>{{ .ort }}</span></div>
    <em>{{ .rolle }}</em>
  </li>
  {{ end }}
</ol>
